[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edgecase-forge"
version = "0.1.0"
description = "Evidence-first adversarial testing for FastAPI repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
]
benchmark = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
edgecase-forge = "edgecase_forge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/edgecase_forge", "benchmarks"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/flashcart/oracle"]
addopts = "-q"
